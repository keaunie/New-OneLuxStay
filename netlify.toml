[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "18"

[dev]
targetPort = 5174

[[headers]]
for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: http://localhost:* https://localhost:* https://oneluxstayprop.netlify.app https://oneluxstay.netlify.app https://maps.googleapis.com https://maps.gstatic.com; frame-src 'self' https://openstreetmap.org https://*.openstreetmap.org https://www.google.com; child-src 'self' https://openstreetmap.org https://*.openstreetmap.org; worker-src 'self' blob:;"

[[headers]]
for = "/private/roadmap/*"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Cache-Control = "no-store"

[[redirects]]
from = "/api/availability"
to = "/.netlify/functions/api-availability"
status = 200

[[redirects]]
from = "/api/checkout"
to = "/.netlify/functions/api-checkout"
status = 200

[[redirects]]
from = "/api/webhook"
to = "/.netlify/functions/api-webhook"
status = 200

[[redirects]]
from = "/api/whatsapp"
to = "/.netlify/functions/whatsapp-webhook"
status = 200

[[redirects]]
from = "/api/whatsapp-status"
to = "/.netlify/functions/whatsapp-status"
status = 200

# SPA fallback - KEEP THIS
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Scheduled function - KEEP THIS
[functions."refresh-guesty-token"]
schedule = "@daily"
