[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "18"

[dev]
targetPort = 5174

# SPA fallback — KEEP THIS
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Scheduled function — KEEP THIS
[functions."refresh-guesty-token"]
schedule = "@daily"
