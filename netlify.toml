[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "20"
  GUESTY_MAX_CONCURRENT = "1"
  GUESTY_MIN_INTERVAL_MS = "10000"
  GUESTY_QUOTE_BULK_LIMIT = "2"
  GUESTY_QUOTE_BULK_TIMEOUT_MS = "10000"
  GUESTY_QUOTE_BULK_PREWARM_LIMIT = "2"

[dev]
targetPort = 5174

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
